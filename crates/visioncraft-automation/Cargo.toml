[package]
name = "visioncraft-automation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
visioncraft-core = { path = "../visioncraft-core" }
# The built-in species, for `species.list`.
visioncraft-flora = { path = "../visioncraft-flora" }
serde = "1"
serde_json = "1"
# 3dcraft (MIT), already a dependency of the core: SHA-256 for the control channel's
# challenge-response (proof.rs).
craft3d-doc = { git = "https://github.com/johancoppens/3dcraft", tag = "v0.1.1" }

# The bridge's nonces; the control channel does not exist in the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
