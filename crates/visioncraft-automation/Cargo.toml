[package]
name = "visioncraft-automation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
visioncraft-core = { path = "../visioncraft-core" }
# The built-in species, for `species.list`; with `serde`, to read a custom species' stored
# parameters (`query.bloom_calendar`).
visioncraft-flora = { path = "../visioncraft-flora", features = ["serde"] }
serde = "1"
serde_json = "1"
# 3dcraft (MIT), already a dependency of the core: SHA-256 for the control channel's
# challenge-response (proof.rs).
craft3d-doc = { git = "https://github.com/johancoppens/3dcraft", tag = "v0.1.3" }
# Contact sheets of a film (film.preview {sheet: true}): the frames are decoded, tiled and encoded.
png = "0.17"

# The bridge's nonces; the control channel does not exist in the browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
