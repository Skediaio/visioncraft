name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # mesa-vulkan-drivers gives the renderer tests a software Vulkan adapter (lavapipe);
      # without it wgpu falls back to GL on llvmpipe, which rejects the shaders.
      - name: Native system libraries (eframe, rfd, wgpu)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgtk-3-dev libudev-dev mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Native-only tools (visioncraft-assets, visioncraft-cli control channel) are left out.
      - run: cargo check --target wasm32-unknown-unknown -p visioncraft-core -p visioncraft-render -p visioncraft-automation -p visioncraft -p pipe-length

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
