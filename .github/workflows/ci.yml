name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release pipeline runs this same gate on the tagged commit (release.yml). `ref` is
  # then the commit to check out; empty, it is the commit that triggered the workflow.
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

# Third-party actions are pinned by commit SHA, with their version in the comment. To bump
# one, replace the SHA and the comment together. No checkout keeps the token: nothing here
# needs it after the checkout.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          # This pin has no default for the toolchain, so it is named.
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # mesa-vulkan-drivers gives the renderer tests a software Vulkan adapter (lavapipe);
      # without it wgpu falls back to GL on llvmpipe, which rejects the shaders.
      - name: Native system libraries (eframe, rfd, wgpu)
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libgtk-3-dev libudev-dev mesa-vulkan-drivers
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          # No hardware GPU here: render the reference scenes, compare them on a real GPU.
          VISIONCRAFT_RENDER_ONLY: 1
      # Native-only tools (visioncraft-assets, visioncraft-cli control channel) are left out.
      - run: cargo check --target wasm32-unknown-unknown -p visioncraft-core -p visioncraft-render -p visioncraft-automation -p visioncraft -p pipe-length

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref || '' }}
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@bb119f768ea239e765aeaef5769558d4f21213aa # v2.1.5
        with:
          command: check
