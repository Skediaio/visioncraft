[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "tools/*", "examples/*"]
# Model sources (scripts, briefs), not crates.
exclude = ["examples/models"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# 3dcraft's geometry kernel is too slow to use unoptimised.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
