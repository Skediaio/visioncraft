<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VisionCraft</title>
  <link rel="icon" href="data:,">
  <link data-trunk rel="rust" data-bin="visioncraft" data-wasm-opt="z" data-initializer="initializer.js" />
  <link data-trunk rel="copy-file" href="initializer.js" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0d1219; font-family: system-ui, sans-serif; }
    canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #vc-status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; color: #e8edf3; z-index: 10; }
    #vc-status[hidden] { display: none; }
    #vc-card { max-width: 560px; background: rgba(20, 26, 36, .95); border: 1px solid rgba(255,255,255,.14); border-radius: 14px; padding: 20px 24px; line-height: 1.5; font-size: 15px; }
    #vc-card h1 { font-size: 19px; margin: 0 0 8px; }
    #vc-card ul { margin: 6px 0 10px; padding-left: 20px; }
    #vc-card small { display: block; margin-top: 10px; color: #8d99a8; word-break: break-word; font-family: ui-monospace, monospace; font-size: 12px; }
    #vc-card code { background: rgba(255,255,255,.1); padding: 1px 5px; border-radius: 4px; }
    #vc-bar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.15); margin-top: 12px; overflow: hidden; }
    #vc-fill { height: 100%; width: 0; background: #ffc440; transition: width .2s; }
    #vc-card button { margin-top: 12px; padding: 7px 16px; border-radius: 8px; border: 0; background: #ffc440; font-size: 14px; cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="visioncraft_canvas"></canvas>
  <div id="vc-status"><div id="vc-card"></div></div>
  <script>
    // All texts together so they can be translated.
    const T = {
      loading: "Loading VisionCraft…",
      starting: "Starting…",
      noGpuTitle: "VisionCraft needs WebGPU, and this browser does not offer it",
      noAdapter: "WebGPU is present but no graphics adapter is available.",
      noApi: "This browser has no WebGPU (navigator.gpu is missing).",
      failedTitle: "VisionCraft could not start",
      lostTitle: "The graphics device was lost",
      lostHelp: "The GPU driver reset or the tab was suspended for too long.",
      reload: "Reload",
      help: [
        "Chrome, Edge and Brave on Windows, macOS, ChromeOS and Android work out of the box when up to date.",
        "Linux (Chrome, Edge, Brave, Chromium): open <code>chrome://flags/#enable-unsafe-webgpu</code> and <code>chrome://flags/#enable-vulkan</code> and enable both (also <code>#ignore-gpu-blocklist</code> if your GPU is blocklisted), restart the browser, and check <code>chrome://gpu</code> for WebGPU: Hardware accelerated.",
        "Firefox and Safari: WebGPU support depends on the version. If it fails, use a Chromium-based browser.",
      ],
      desktop: "A desktop version of VisionCraft exists and does not need a browser.",
    };
    const card = document.getElementById('vc-card');
    const status = document.getElementById('vc-status');
    const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    window.vcLoading = (text, fraction) => {
      if (window.__vcFailed) return;
      status.hidden = false;
      card.innerHTML = `<h1>${esc(text)}</h1><div id="vc-bar"><div id="vc-fill" style="width:${Math.round((fraction ?? 0.02) * 100)}%"></div></div>`;
    };
    window.vcHide = () => { status.hidden = true; };
    window.vcFail = (title, detail, reload) => {
      window.__vcFailed = true;
      status.hidden = false;
      card.innerHTML = `<h1>${esc(title)}</h1><ul>${T.help.map(h => `<li>${h}</li>`).join('')}</ul><p>${esc(T.desktop)}</p>` +
        (reload ? `<button onclick="location.reload()">${esc(T.reload)}</button>` : '') + (detail ? `<small>${esc(detail)}</small>` : '');
    };
    window.vcT = T;
    window.vcLoading(T.loading);
    // Resolves when WebGPU is usable; the wasm entry waits for it before starting.
    window.__vcReady = (async () => {
      if (!navigator.gpu) { window.vcFail(T.noGpuTitle, T.noApi); throw new Error(T.noApi); }
      let adapter = null, err = '';
      try { adapter = await navigator.gpu.requestAdapter(); } catch (e) { err = String(e); }
      if (!adapter) { window.vcFail(T.noGpuTitle, T.noAdapter + (err ? ' ' + err : '')); throw new Error(T.noAdapter); }
      // Report a lost device later, whoever created it.
      const proto = Object.getPrototypeOf(adapter);
      const original = proto.requestDevice;
      proto.requestDevice = async function (...args) {
        const device = await original.apply(this, args);
        device.lost.then(info => { if (info.reason !== 'destroyed') window.vcFail(T.lostTitle, T.lostHelp + ' ' + (info.message || ''), true); });
        return device;
      };
      return true;
    })();
    window.__vcReady.catch(() => {});
  </script>
</body>
</html>
