[package]
name = "visioncraft"
default-run = "visioncraft"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

# One crate, one `main` for both targets (as the eframe template): native bin,
# and the bin trunk builds for wasm32; `src/lib.rs` holds the app.
[dependencies]
visioncraft-core = { path = "../../crates/visioncraft-core" }
visioncraft-flora = { path = "../../crates/visioncraft-flora", features = ["serde"] }
visioncraft-render = { path = "../../crates/visioncraft-render" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# MIT/Apache-2.0: decodes .mcmat base-colour PNGs (swatch thumbnails, average colour) and writes smoke screenshots.
png = "0.17"
# MIT: file dialogs; asynchronous, and the only option on wasm (upload, download).
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
glam = "0.30"
# MIT/Apache-2.0: reads the library's GLB models (parser only: no image import, no file or URL loading).
gltf = { version = "1", default-features = false, features = ["utils", "names", "KHR_materials_emissive_strength", "KHR_materials_transmission"] }
# MIT/Apache-2.0: Radiance .hdr skies everywhere; JPEG and PNG textures natively (the browser decodes them on the web).
image = { version = "0.25", default-features = false, features = ["hdr"] }
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
# `wgpu_no_default_features` instead of `wgpu`: the latter turns on wgpu's `webgl`
# (a GLES backend in the wasm), and VisionCraft is WebGPU only.
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wayland", "x11", "wgpu_no_default_features", "persistence"] }
egui-wgpu = { version = "0.36", default-features = false, features = ["fragile-send-sync-non-atomic-wasm"] }
wgpu = "30.0.1"
# MIT: the viewpoint pictures as one download on the web (stored, no compression).
zip = { version = "9", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# CC0-1.0: watches the linked model file.
notify = "8"
# The control channel AI agents drive the window through (`visioncraft-cli mcp --bridge`).
visioncraft-automation = { path = "../../crates/visioncraft-automation" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4.79"
js-sys = "0.3"
web-sys = { version = "0.3.106", features = ["Document", "Window", "HtmlCanvasElement", "Storage", "Worker", "DedicatedWorkerGlobalScope", "MessageEvent"] }
log = "0.4"
